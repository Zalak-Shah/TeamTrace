<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BorderShield AI — Audit Logs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#0B0F1A; --panel:#111726; --panel-2:#0D1220; --border:#1E293B; --border-2:#1B2333; --border-3:#263049;
  --text:#F1F4F9; --text-2:#E5E9F0; --text-3:#B7C0D3; --text-4:#8B96AC; --text-5:#5B6478;
  --cyan:#22D3EE; --indigo:#6366F1;
  --valid:#34D399; --low:#5EEAD4; --medium:#FBBF24; --suspicious:#FB923C; --high:#F87171;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{width:236px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--border-2);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;z-index:40;}
.brand{padding:22px 20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-2);}
.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--indigo));
  display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:700;font-size:15px;}
.brand-name{font-weight:600;font-size:15px;color:var(--text);line-height:1.1;}
.brand-sub{font-size:10.5px;color:var(--text-5);letter-spacing:.5px;}
.nav{flex:1;overflow-y:auto;padding:14px 12px;}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;margin-bottom:3px;
  color:var(--text-4);font-size:13.5px;font-weight:500;}
.nav a:hover{background:#141B2D;}
.nav a.active{background:rgba(34,211,238,.1);color:var(--cyan);font-weight:600;}
.nav i{font-size:16px;width:16px;text-align:center;}
.officer-card{padding:16px;border-top:1px solid var(--border-2);}
.officer-inner{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#141B2D;border-radius:10px;}
.avatar{width:30px;height:30px;border-radius:999px;background:var(--border);display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:600;color:var(--cyan);flex-shrink:0;}
.officer-name{font-size:12.5px;color:var(--text-2);font-weight:500;}
.officer-role{font-size:10.5px;color:var(--text-5);}

/* ---------- Main / Topbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;
  border-bottom:1px solid var(--border-2);background:var(--bg);position:sticky;top:0;z-index:10;}
.page-title{margin:0;font-size:19px;font-weight:600;color:var(--text);}
.page-sub{margin:3px 0 0;font-size:12.5px;color:var(--text-5);}
.status-pill{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--valid);
  background:rgba(52,211,153,.1);padding:6px 11px;border-radius:999px;border:1px solid rgba(52,211,153,.3);}
.content{padding:28px;flex:1;}
.menu-btn{display:none;background:none;border:none;color:var(--text-4);font-size:20px;cursor:pointer;margin-right:6px;}

/* ---------- Building blocks ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.section-title h3{margin:0;font-size:14px;font-weight:600;color:var(--text-2);letter-spacing:.2px;
  display:flex;align-items:center;gap:9px;}
.section-title h3 i{color:var(--cyan);font-size:16px;}
.ghost-link{background:none;border:none;color:var(--cyan);font-size:12px;cursor:pointer;font-weight:500;
  display:flex;align-items:center;gap:3px;}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-13{grid-template-columns:1.3fr 1fr;}
.grid-auto{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
@media (max-width:860px){.grid-2,.grid-13{grid-template-columns:1fr;}}

.stat-label{font-size:12px;color:var(--text-4);margin-bottom:8px;}
.stat-value{font-size:26px;font-weight:600;color:var(--text-2);}
.stat-sub{font-size:12px;color:var(--text-5);margin-top:6px;}

.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;
  font-weight:600;letter-spacing:.2px;white-space:nowrap;}
.badge.sm{padding:3px 9px;font-size:11px;}
.badge-dot{width:6px;height:6px;border-radius:999px;}
.badge.valid{color:var(--valid);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);}
.badge.valid .badge-dot{background:var(--valid);}
.badge.low{color:var(--low);background:rgba(94,234,212,.10);border:1px solid rgba(94,234,212,.3);}
.badge.low .badge-dot{background:var(--low);}
.badge.medium{color:var(--medium);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);}
.badge.medium .badge-dot{background:var(--medium);}
.badge.suspicious{color:var(--suspicious);background:rgba(251,146,60,.13);border:1px solid rgba(251,146,60,.4);}
.badge.suspicious .badge-dot{background:var(--suspicious);}
.badge.high{color:var(--high);background:rgba(248,113,113,.13);border:1px solid rgba(248,113,113,.4);}
.badge.high .badge-dot{background:var(--high);}

.mono-tag{font-family:'JetBrains Mono',monospace;font-size:12px;color:#9CB4D6;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead tr{text-align:left;color:var(--text-5);border-bottom:1px solid var(--border-2);}
th{padding:8px 10px;font-weight:500;}
td{padding:10px;border-bottom:1px solid #161D2E;white-space:nowrap;}
.table-wrap{overflow-x:auto;}

input[type=text],input[type=search],select{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text-2);font-size:13px;outline:none;font-family:inherit;}
input:focus,select:focus{border-color:var(--cyan)!important;}

.btn{padding:11px 20px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--indigo));color:var(--bg);}
.btn-ghost{background:transparent;border:1px solid var(--border-3);color:var(--text-4);}
.btn-primary:disabled{background:var(--border-2);color:var(--text-5);cursor:default;}

.progress-bar{height:6px;border-radius:999px;background:var(--border-2);overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;}

@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .menu-btn{display:inline-block;}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;}
}

</style>
</head>
<body>
<div class="app">
  <div class="scrim" id="scrim" style="display:none;"></div>

    <div class="topbar" id="topbar"></div>
    <div class="content">
      <div class="panel">
        <div class="section-title"><h3><i class="ti ti-file-clock"></i>Immutable audit chain</h3></div>
        <div style="font-size:12.5px;color:var(--text-4);margin-bottom:16px;">
          Each screening event is hash-chained to the previous entry to prevent tampering with decision records.

    </div>
